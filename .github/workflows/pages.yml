name: Test and deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'   # hourly: refresh the TFR and NOTAM snapshots (neither source allows browser requests)

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test

  deploy:
    if: github.ref == 'refs/heads/main' || github.event_name == 'schedule'
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fetch active TFRs
        run: node pipeline/tfr.mjs || echo '{"fetched":null,"tfrs":[]}' > app/data/tfr.json
      - name: Fetch NOTAMs (skipped without the FAA NOTAM API key secrets)
        env:
          FAA_NOTAM_CLIENT_ID: ${{ secrets.FAA_NOTAM_CLIENT_ID }}
          FAA_NOTAM_CLIENT_SECRET: ${{ secrets.FAA_NOTAM_CLIENT_SECRET }}
        run: node pipeline/notams.mjs || echo '{"fetched":null,"notams":[]}' > app/data/notams.json
      - name: Assemble site
        run: |
          mkdir -p _site/prototypes
          cp -r app/* _site/
          cp corridor.html skylanes.html _site/prototypes/
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
